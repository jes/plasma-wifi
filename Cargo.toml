[package]
name = "plasma-wifi"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A portable XY plasma controller for FluidNC"
license = "MIT"

[dependencies]
anyhow = "1"
egui = "0.34"
egui_software_backend = { version = "0.0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json"] }
x11rb = "0.13"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
